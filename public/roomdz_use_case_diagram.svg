<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 970" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ea580c" />
    </marker>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-8%" y="-15%" width="116%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>
    <filter id="card-shadow" x="-5%" y="-3%" width="110%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#64748b" flood-opacity="0.10" />
    </filter>

    <!-- Faint Blueprint Grid on White -->
    <pattern id="light-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Clean White Canvas Background with Subtle Grid -->
  <rect width="1100" height="970" fill="#ffffff" />
  <rect width="1100" height="970" fill="url(#light-grid)" />

  <!-- Outer Canvas Border -->
  <rect x="15" y="15" width="1070" height="940" rx="14" fill="none" stroke="#e2e8f0" stroke-width="2" />

  <!-- ================= TOP LEFT HEADER & ROLES ================= -->
  <g transform="translate(25, 25)">
    <rect x="0" y="0" width="205" height="125" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)" />
    <text x="14" y="24" font-size="13.5" font-weight="800" fill="#0f172a" letter-spacing="0.1">RoomDZ</text>
    <text x="75" y="24" font-size="11.5" font-weight="600" fill="#64748b">(Room Digital Finder)</text>
    <line x1="14" y1="33" x2="191" y2="33" stroke="#e2e8f0" stroke-width="1" />
    
    <circle cx="24" cy="50" r="3.5" fill="#2563eb" />
    <text x="36" y="54" font-size="12" font-weight="600" fill="#334155">Super Admin</text>

    <circle cx="24" cy="71" r="3.5" fill="#3b82f6" />
    <text x="36" y="75" font-size="12" font-weight="600" fill="#334155">Admin</text>

    <circle cx="24" cy="92" r="3.5" fill="#16a34a" />
    <text x="36" y="96" font-size="12" font-weight="600" fill="#334155">Owner</text>

    <circle cx="24" cy="113" r="3.5" fill="#ea580c" />
    <text x="36" y="117" font-size="12" font-weight="600" fill="#334155">Customer</text>
  </g>

  <!-- ================= SYSTEM BOUNDARY ================= -->
  <rect x="330" y="35" width="380" height="885" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 4" />
  
  <!-- System Label Badge -->
  <g transform="translate(520, 35)">
    <rect x="-115" y="-14" width="230" height="28" rx="7" fill="#0f172a" />
    <text x="0" y="5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">ROOMDZ BACKEND SYSTEM</text>
  </g>

  <!-- ================= USE CASES (OVALS) ================= -->
  <!-- Center X = 520, Width = 260, Height = 46 (Left = 390, Right = 650) -->
  
  <!-- 1. Authentication & Profile -->
  <g id="uc-1" transform="translate(520, 95)" filter="url(#shadow)">
    <rect x="-130" y="-23" width="260" height="46" rx="23" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="5" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Authentication &amp; Profile</text>
  </g>

  <!-- 2. Browse & Search Rooms -->
  <g id="uc-2" transform="translate(520, 175)" filter="url(#shadow)">
    <rect x="-130" y="-23" width="260" height="46" rx="23" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="5" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Browse &amp; Search Rooms</text>
  </g>

  <!-- 3. View Room on Map -->
  <g id="uc-3" transform="translate(520, 255)" filter="url(#shadow)">
    <rect x="-130" y="-23" width="260" height="46" rx="23" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="5" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">View Room on Map (Coordinates)</text>
  </g>

  <!-- 4. Manage Favorites -->
  <g id="uc-4" transform="translate(520, 335)" filter="url(#shadow)">
    <rect x="-130" y="-23" width="260" height="46" rx="23" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="5" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Manage Favorites</text>
  </g>

  <!-- 5. Request Room Viewing -->
  <g id="uc-5" transform="translate(520, 415)" filter="url(#shadow)">
    <rect x="-130" y="-23" width="260" height="46" rx="23" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="5" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Request Room Viewing</text>
  </g>

  <!-- 6. Manage Owner Rooms -->
  <g id="uc-6" transform="translate(520, 495)" filter="url(#shadow)">
    <rect x="-130" y="-23" width="260" height="46" rx="23" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="5" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Manage Owner Rooms (CRUD)</text>
  </g>

  <!-- 7. Manage Viewing Requests -->
  <g id="uc-7" transform="translate(520, 575)" filter="url(#shadow)">
    <rect x="-130" y="-23" width="260" height="46" rx="23" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="5" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Confirm / Reject Viewing Requests</text>
  </g>

  <!-- 8. View Owner Dashboard Stats -->
  <g id="uc-8" transform="translate(520, 655)" filter="url(#shadow)">
    <rect x="-130" y="-23" width="260" height="46" rx="23" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="5" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">View Owner Dashboard Stats</text>
  </g>

  <!-- 9. Manage Categories -->
  <g id="uc-9" transform="translate(520, 735)" filter="url(#shadow)">
    <rect x="-130" y="-23" width="260" height="46" rx="23" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="5" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Manage Categories (Room Types)</text>
  </g>

  <!-- 10. Manage Roles & Permissions -->
  <g id="uc-10" transform="translate(520, 815)" filter="url(#shadow)">
    <rect x="-130" y="-23" width="260" height="46" rx="23" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="0" y="5" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Manage Roles &amp; Permissions</text>
  </g>


  <!-- ================= ACTOR: ADMIN (LEFT) ================= -->
  <g id="actor-admin" transform="translate(130, 480)">
    <!-- Stickman Admin -->
    <circle cx="0" cy="-45" r="18" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" />
    <line x1="0" y1="-27" x2="0" y2="25" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-30" y1="-10" x2="30" y2="-10" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="25" x2="-24" y2="70" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="25" x2="24" y2="70" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
    <!-- Label Badge -->
    <rect x="-45" y="82" width="90" height="26" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="0" y="99" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">Admin</text>
  </g>


  <!-- ================= ACTOR: OWNER (TOP RIGHT) ================= -->
  <g id="actor-owner" transform="translate(970, 310)">
    <!-- Stickman Owner -->
    <circle cx="0" cy="-45" r="18" fill="#ffffff" stroke="#16a34a" stroke-width="2.5" />
    <line x1="0" y1="-27" x2="0" y2="25" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-30" y1="-10" x2="30" y2="-10" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="25" x2="-24" y2="70" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="25" x2="24" y2="70" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" />
    <!-- Label Badge -->
    <rect x="-45" y="82" width="90" height="26" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
    <text x="0" y="99" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">Owner</text>
  </g>


  <!-- ================= ACTOR: CUSTOMER (BOTTOM RIGHT) ================= -->
  <g id="actor-customer" transform="translate(970, 680)">
    <!-- Stickman Customer -->
    <circle cx="0" cy="-45" r="18" fill="#ffffff" stroke="#ea580c" stroke-width="2.5" />
    <line x1="0" y1="-27" x2="0" y2="25" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-30" y1="-10" x2="30" y2="-10" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="25" x2="-24" y2="70" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="25" x2="24" y2="70" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" />
    <!-- Label Badge -->
    <rect x="-45" y="82" width="90" height="26" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1" />
    <text x="0" y="99" font-size="14" font-weight="700" fill="#c2410c" text-anchor="middle">Customer</text>
  </g>


  <!-- ================= CONNECTOR LINES ================= -->

  <!-- 1. ADMIN CONNECTIONS (BLUE) -->
  <!-- Admin trunk line at x=250 -->
  <path d="M 160 480 L 250 480" fill="none" stroke="#2563eb" stroke-width="1.8" />
  <path d="M 250 95 L 250 815" fill="none" stroke="#2563eb" stroke-width="1.8" />

  <!-- Admin branches to each oval -->
  <path d="M 250 95 L 387 95" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)" />
  <path d="M 250 175 L 387 175" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)" />
  <path d="M 250 255 L 387 255" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)" />
  <path d="M 250 495 L 387 495" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)" />
  <path d="M 250 575 L 387 575" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)" />
  <path d="M 250 655 L 387 655" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)" />
  <path d="M 250 735 L 387 735" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)" />
  <path d="M 250 815 L 387 815" fill="none" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arrow-blue)" />


  <!-- 2. OWNER CONNECTIONS (GREEN) -->
  <!-- Owner trunk line at x=850 -->
  <path d="M 940 310 L 850 310" fill="none" stroke="#16a34a" stroke-width="1.8" />
  <path d="M 850 95 L 850 655" fill="none" stroke="#16a34a" stroke-width="1.8" />

  <!-- Owner branches to permitted use cases -->
  <!-- UC-1: Authentication & Profile -->
  <path d="M 850 95 L 653 95" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow-green)" />
  <!-- UC-2: Browse & Search Rooms -->
  <path d="M 850 175 L 653 175" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow-green)" />
  <!-- UC-3: View Room on Map -->
  <path d="M 850 255 L 653 255" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow-green)" />
  <!-- UC-6: Manage Owner Rooms -->
  <path d="M 850 495 L 653 495" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow-green)" />
  <!-- UC-7: Confirm / Reject Viewing Requests -->
  <path d="M 850 575 L 653 575" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow-green)" />
  <!-- UC-8: View Owner Dashboard Stats -->
  <path d="M 850 655 L 653 655" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow-green)" />


  <!-- 3. CUSTOMER CONNECTIONS (ORANGE) -->
  <!-- Customer trunk line at x=780 -->
  <path d="M 940 680 L 780 680" fill="none" stroke="#ea580c" stroke-width="1.8" />
  <path d="M 780 95 L 780 680" fill="none" stroke="#ea580c" stroke-width="1.8" />

  <!-- Customer branches to permitted use cases -->
  <!-- UC-1: Authentication & Profile -->
  <path d="M 780 95 L 653 95" fill="none" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arrow-orange)" />
  <!-- UC-2: Browse & Search Rooms -->
  <path d="M 780 175 L 653 175" fill="none" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arrow-orange)" />
  <!-- UC-3: View Room on Map -->
  <path d="M 780 255 L 653 255" fill="none" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arrow-orange)" />
  <!-- UC-4: Manage Favorites -->
  <path d="M 780 335 L 653 335" fill="none" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arrow-orange)" />
  <!-- UC-5: Request Room Viewing -->
  <path d="M 780 415 L 653 415" fill="none" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arrow-orange)" />

</svg>
